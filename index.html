<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARA CTA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0b0b0b; color: #ffd700; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        #loader-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease, visibility 0.8s; }
        .spinner-main { width: 60px; height: 60px; border: 4px solid rgba(255, 215, 0, 0.1); border-top: 4px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .loader-title { margin-top: 20px; font-size: 22px; letter-spacing: 2px; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        header { width: 100%; max-width: 800px; background-color: #121212; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 215, 0, 0.2); }
        header h1 { font-size: 22px; color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
        .sign-btn { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; padding: 8px 18px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .sign-btn:hover { transform: scale(1.05); box-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }
        
        #main-app { width: 100%; max-width: 800px; opacity: 0; transition: opacity 1s ease; display: flex; flex-direction: column; height: 100vh; position: relative; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 120px; scroll-behavior: smooth; }
        
        .message { max-width: 80%; padding: 12px 18px; border-radius: 15px; line-height: 1.7; word-wrap: break-word; animation: fadeIn 0.3s ease-in-out; white-space: pre-wrap; font-size: 15px; }
        
        /* پرسیارەکانی تۆ - لای ڕاست */
        .user-message { 
            align-self: flex-start; 
            background-color: #ffd700; 
            color: #000; 
            font-weight: 600; 
            border-bottom-right-radius: 2px; 
            margin-right: 0;
            margin-left: auto;
        }
        
        /* وەڵامەکانی AI - لای چەپ */
        .ai-message { 
            align-self: flex-end; 
            background-color: #1a1a1a; 
            color: #ffd700; 
            border: 1px solid rgba(255, 215, 0, 0.3); 
            border-bottom-left-radius: 2px; 
            margin-left: 0;
            margin-right: auto;
        }
        
        .inline-loader { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(255, 215, 0, 0.2); border-top: 3px solid #ffd700; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 5px; }

        .input-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 800px; background-color: #121212; padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255, 215, 0, 0.2); z-index: 100; }
        .input-bar textarea { flex: 1; background-color: #1f1f1f; border: 1px solid #ffd700; color: #fff; padding: 10px 15px; border-radius: 10px; resize: none; height: 45px; outline: none; font-size: 14px; }
        .btn { background: transparent; border: 1px solid #ffd700; color: #ffd700; width: 45px; height: 45px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .btn:hover { background-color: #ffd700; color: #000; }
        #file-input { display: none; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 10000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #141414; border: 2px solid #ffd700; border-radius: 15px; padding: 30px; width: 90%; max-width: 400px; text-align: center; transform: translateY(-20px); transition: transform 0.4s ease; box-shadow: 0 0 25px rgba(255, 215, 0, 0.2); }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-card h2 { color: #ffd700; font-size: 26px; margin-bottom: 10px; }
        .price { font-size: 32px; color: #fff; margin: 15px 0; }
        .price span { font-size: 16px; color: #aaa; }
        .features-list { text-align: right; margin: 20px 0; color: #ddd; font-size: 14px; line-height: 1.8; }
        .buy-btn { width: 100%; padding: 12px; background: #ffd700; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .close-btn { background: transparent; color: #aaa; border: none; cursor: pointer; font-size: 14px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="spinner-main"></div>
        <div class="loader-title">YARA CTA</div>
    </div>

    <div id="main-app">
        <header>
            <h1>YARA CTA</h1>
            <button class="sign-btn" onclick="openProModal()">SIGN</button>
        </header>

        <div id="chat-box"></div>

        <div class="input-bar">
            <button class="btn" onclick="document.getElementById('file-input').click()" title="ناردنی وێنە">📷</button>
            <input type="file" id="file-input" accept="image/*">
            <button class="btn" onclick="triggerVoice()" title="دەنگ">🎙️</button>
            <textarea id="user-input" placeholder="پەیامەکەت لێرە بنووسە..."></textarea>
            <button class="btn" onclick="sendMessage()" title="ناردن">➢</button>
        </div>
    </div>

    <div class="modal-overlay" id="proModal">
        <div class="modal-card">
            <h2>YARA CTA PRO</h2>
            <p style="color: #aaa;">ئاستی زیرەکی دەستکردەکەت بەرز بکەرەوە</p>
            <div class="price">$7 <span>/ مانگانە</span></div>
            <div class="features-list">
                ✓ وەڵامدانەوەی خێراتر<br>
                ✓ توانای شیکردنەوەی وێنە و بەڵگەنامە گەورەکان<br>
                ✓ نەبوونی هیچ سنوورێک لە ژمارەی پرسیارەکان<br>
                ✓ پشتگیری تایبەت 24/7
            </div>
            <button class="buy-btn" onclick="alert('ئەم بەشە بەردەست دەبێت.')">ئێستا بەشداری بکە</button>
            <button class="close-btn" onclick="closeProModal()">داخستن</button>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6LvJmc5kxiVyq_Xk0rIZAxk5yMGEwT6LONint7EpUe3Ng"; 

        const geminiEndpoints = [
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent",
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent"
        ];

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-screen');
                const mainApp = document.getElementById('main-app');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                mainApp.style.opacity = '1';
            }, 1200);
        });

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();

            if (!userText) return;

            // پرسیاری بەکارهێنەر - دەچێتە لای ڕاست
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.innerText = userText;
            chatBox.appendChild(userMsgDiv);

            inputField.value = '';
            scrollToBottom();

            // وەڵامی AI - دەچێتە لای چەپ
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.innerHTML = `<div class="inline-loader"></div>`;
            chatBox.appendChild(aiMsgDiv);
            scrollToBottom();

            let responseText = "";

            const systemPrompt = "تۆ YARA CTA یت. ناوت YARA CTA یە و لەلایەن YARA CTA دروستکراویت. هەموو وەڵامەکانت بە زمانی کوردیی سۆرانی زۆر ڕەوان، پاراو و بەبێ هەڵەی ئینگلیزی بنووسە.";

            for (let url of geminiEndpoints) {
                try {
                    const response = await fetch(`${url}?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userText }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    const data = await response.json();

                    if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                        responseText = data.candidates[0].content.parts[0].text;
                        break;
                    }
                } catch (error) {
                    console.log("هەڵەی پەیوەندی.");
                }
            }

            if (responseText) {
                aiMsgDiv.innerText = responseText;
            } else {
                aiMsgDiv.innerText = "تکایە کەمێکی تر هەوڵ بدەرەوە.";
            }

            scrollToBottom();
        }

        function openProModal() { document.getElementById('proModal').classList.add('active'); }
        function closeProModal() { document.getElementById('proModal').classList.remove('active'); }
        function triggerVoice() { alert("تایبەتمەندی دەنگ بەردەست دەبێت."); }
    </script>
</body>
</html>
